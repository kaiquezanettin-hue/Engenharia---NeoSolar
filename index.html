  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sun: #FFD04C; --sun-dark: #E6B800; --sun-dim: rgba(255,208,76,0.13); --sun-border: rgba(255,208,76,0.32);
      --navy: #2A2B2C; --navy-mid: #3E3F41; --navy-light: #565759;
      --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.15);
      --text: #F0F0F0; --text-muted: #8C8D8F; --text-faint: #565759;
      --green: #2ECC71; --green-dim: rgba(46,204,113,0.12); --green-border: rgba(46,204,113,0.28);
      --blue: #A8D8FF; --blue-dim: rgba(168,216,255,0.12); --blue-border: rgba(168,216,255,0.28);
      --red: #e05a5a; --red-dim: rgba(224,90,90,0.12);
    }
    html, body { height: 100%; font-family: "Barlow", sans-serif; background: var(--navy); color: var(--text); }

    /* LOGIN */
    #login-screen { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 1rem; }
    .login-box { background: var(--navy-mid); border: 1px solid var(--sun-border); border-radius: 16px; padding: clamp(1.75rem,5vw,3rem) clamp(1.5rem,5vw,2.75rem); width: 100%; max-width: 380px; text-align: center; }
    .login-logo-wrap { height: clamp(24px,4vw,36px); margin: 0 auto clamp(1.25rem,3vw,2rem); display: flex; align-items: center; justify-content: center; }
    .login-logo-wrap svg { height: 100%; width: auto; }
    .login-title { font-size: clamp(0.65rem,1.5vw,0.75rem); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: clamp(1.25rem,3vw,2rem); }
    .login-field input { width: 100%; background: var(--navy); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: "Barlow", sans-serif; font-size: clamp(0.875rem,2vw,1rem); padding: clamp(0.65rem,2vw,0.85rem) 1rem; outline: none; transition: border-color 0.15s; text-align: center; letter-spacing: 0.08em; margin-bottom: clamp(0.75rem,2vw,1rem); display: block; }
    .login-field input:focus { border-color: var(--sun-border); }
    .login-field input::placeholder { color: var(--text-faint); }
    .login-btn { width: 100%; background: var(--sun); color: var(--navy); border: none; border-radius: 8px; font-family: "Barlow", sans-serif; font-size: clamp(0.8rem,2vw,0.9rem); font-weight: 800; letter-spacing: 0.1em; padding: clamp(0.65rem,2vw,0.85rem) 1rem; cursor: pointer; transition: background 0.15s; text-transform: uppercase; }
    .login-btn:hover { background: var(--sun-dark); }
    .login-error { font-size: 0.78rem; color: var(--red); margin-top: 0.75rem; min-height: 1rem; display: none; }

    /* APP */
    #app { display: none; min-height: 100vh; }
    .topbar { background: var(--navy-mid); border-bottom: 3px solid var(--sun); padding: 0 clamp(1rem,3vw,2.5rem); height: clamp(52px,7vh,68px); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar-left { display: flex; align-items: center; gap: clamp(10px,2vw,20px); }
    .logo-img-wrap { height: clamp(22px,3vw,30px); display: flex; align-items: center; }
    .logo-img-wrap svg { height: 100%; width: auto; }
    .divbar { width: 1px; height: clamp(20px,3vh,28px); background: rgba(255,255,255,0.12); }
    .hub-label { font-size: clamp(0.6rem,1vw,0.75rem); font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sun); }
    .topbar-right { display: flex; align-items: center; gap: clamp(8px,1.5vw,14px); font-size: clamp(0.65rem,1vw,0.75rem); font-family: monospace; color: var(--text-faint); }
    .status-dot { display: inline-flex; align-items: center; gap: 5px; font-size: clamp(0.6rem,1vw,0.7rem); color: var(--green); }
    .status-dot::before { content: ""; width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .icon-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-family: "Barlow", sans-serif; font-size: clamp(0.6rem,1vw,0.72rem); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px clamp(6px,1.5vw,10px); cursor: pointer; transition: border-color 0.15s, color 0.15s; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .icon-btn:hover { border-color: var(--sun-border); color: var(--sun); }
    .icon-btn svg { width: 13px; height: 13px; }

    .main { width: 100%; padding: clamp(1.25rem,3vw,2.5rem) clamp(1rem,4vw,3rem) clamp(2rem,4vw,3rem); }
    .section { margin-bottom: clamp(1.75rem,3vw,2.5rem); animation: fadeUp 0.4s ease both; }
    .section:nth-child(1){animation-delay:.04s} .section:nth-child(2){animation-delay:.1s} .section:nth-child(3){animation-delay:.16s}
    .sec-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: clamp(0.75rem,2vw,1rem); padding-bottom: clamp(0.5rem,1vw,0.75rem); border-bottom: 1px solid var(--border); }
    .pip { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .sec-label { font-size: clamp(0.6rem,1vw,0.7rem); font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
    .sec-count { margin-left: auto; font-size: clamp(0.6rem,1vw,0.6875rem); font-family: monospace; color: var(--text-faint); }
    .cards { display: grid; grid-template-columns: repeat(3,1fr); gap: clamp(8px,1.5vw,14px); }
    @media(max-width:900px){ .cards{grid-template-columns:repeat(2,1fr)} }
    @media(max-width:520px){ .cards{grid-template-columns:1fr} }
    .card { background: var(--navy-mid); border: 1px solid var(--border); border-radius: clamp(10px,1.5vw,14px); padding: clamp(1rem,2vw,1.5rem); text-decoration: none; display: block; position: relative; overflow: hidden; transition: border-color 0.15s,transform 0.15s,background 0.15s; }
    .card::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; opacity: 0; transition: opacity 0.2s; }
    .card:hover { border-color: var(--border-hover); background: var(--navy-light); transform: translateY(-2px); }
    .card:hover::after { opacity: 1; }
    .card:hover .arr { opacity: 1; transform: translate(3px,-3px); }
    .ct { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: clamp(0.75rem,1.5vw,1rem); }
    .cico { width: clamp(30px,3vw,38px); height: clamp(30px,3vw,38px); border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .arr { font-size: clamp(0.875rem,1.2vw,1rem); color: var(--text-faint); opacity: 0; transition: opacity 0.15s,transform 0.15s; }
    .cn { font-size: clamp(0.85rem,1.4vw,1rem); font-weight: 700; color: var(--text); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.01em; }
    .cd { font-size: clamp(0.72rem,1.1vw,0.82rem); color: var(--text-muted); line-height: 1.5; font-weight: 300; }
    .tag { display: inline-flex; align-items: center; gap: 5px; font-size: clamp(0.58rem,.85vw,.65rem); font-family: monospace; padding: 3px clamp(7px,1.2vw,10px); border-radius: 4px; margin-top: clamp(0.625rem,1.5vw,1rem); font-weight: 600; border: 1px solid transparent; letter-spacing: .06em; text-transform: uppercase; }
    .tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .65; }
    .at .pip{background:var(--sun)} .at .card::after{background:var(--sun)} .at .cico{background:var(--sun-dim);color:var(--sun)} .at .tag{background:var(--sun-dim);color:var(--sun);border-color:var(--sun-border)}
    .np .pip{background:var(--blue)} .np .card::after{background:var(--blue)} .np .cico{background:var(--blue-dim);color:var(--blue)} .np .tag{background:var(--blue-dim);color:var(--blue);border-color:var(--blue-border)}
    .pe .pip{background:var(--green)} .pe .card::after{background:var(--green)} .pe .cico{background:var(--green-dim);color:var(--green)} .pe .tag{background:var(--green-dim);color:var(--green);border-color:var(--green-border)}
    .add-card { background: transparent; border: 1px dashed rgba(255,255,255,0.1); border-radius: clamp(10px,1.5vw,14px); padding: clamp(1rem,2vw,1.5rem); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: clamp(0.72rem,1.1vw,0.8rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); cursor: pointer; min-height: clamp(80px,10vw,130px); transition: border-color 0.15s,color 0.15s,background 0.15s; font-family: "Barlow",sans-serif; }
    .add-card:hover { border-color: var(--sun-border); color: var(--sun); background: var(--sun-dim); }
    .add-card svg { width: 16px; height: 16px; }
    .error-banner { background: var(--red-dim); border: 1px solid var(--red); border-radius: 10px; padding: 1rem 1.25rem; color: var(--red); font-size: 0.82rem; margin-bottom: 1.5rem; line-height: 1.5; }
    .error-banner code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; }
    .footer { margin-top: clamp(1.5rem,3vw,2.5rem); padding-top: clamp(1rem,2vw,1.5rem); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: clamp(0.62rem,1vw,0.72rem); color: var(--text-faint); font-family: monospace; flex-wrap: wrap; gap: 4px; }
    .fy { color: var(--sun); margin: 0 5px; }
    svg.ico { display: block; width: clamp(14px,2vw,18px); height: clamp(14px,2vw,18px); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--navy-mid); border: 1px solid var(--border-hover); border-radius: 16px; padding: clamp(1.5rem,4vw,2.5rem); width: 100%; max-width: 480px; animation: fadeUp 0.2s ease; }
    .modal-title { font-size: clamp(0.9rem,2vw,1.1rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1.5rem; color: var(--sun); }
    .form-group { margin-bottom: 1rem; }
    .form-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .form-input, .form-select { width: 100%; background: var(--navy); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: "Barlow",sans-serif; font-size: 0.875rem; padding: 0.65rem 0.875rem; outline: none; transition: border-color 0.15s; appearance: none; }
    .form-input:focus, .form-select:focus { border-color: var(--sun-border); }
    .form-input::placeholder { color: var(--text-faint); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.5rem; }
    .btn-cancel { background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-family: "Barlow",sans-serif; font-size: 0.85rem; font-weight: 600; padding: 0.6rem 1.25rem; cursor: pointer; text-transform: uppercase; }
    .btn-cancel:hover { border-color: var(--border-hover); color: var(--text); }
    .btn-save { background: var(--sun); border: none; border-radius: 8px; color: var(--navy); font-family: "Barlow",sans-serif; font-size: 0.85rem; font-weight: 800; padding: 0.6rem 1.5rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em; }
    .btn-save:hover { background: var(--sun-dark); }
    .json-hint { background: var(--navy); border: 1px solid var(--border); border-radius: 8px; padding: 0.875rem 1rem; margin-top: 1rem; font-size: 0.72rem; color: var(--text-muted); line-height: 1.7; }
    .json-hint code { color: var(--sun); }
    @media(max-width:480px){ .hub-label{display:none} .divbar{display:none} #clock{display:none} .form-row{grid-template-columns:1fr} }
  </style>
</head>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <p class="modal-title">Adicionar Projeto</p>
    <div class="form-group">
      <label class="form-label">Nome do projeto</label>
      <input class="form-input" id="f-name" placeholder="Ex: Dashboard de Vendas" />
    </div>
    <div class="form-group">
      <label class="form-label">Descri&ccedil;&atilde;o</label>
      <input class="form-input" id="f-desc" placeholder="Breve descri&ccedil;&atilde;o" />
    </div>
    <div class="form-group">
      <label class="form-label">URL / Link</label>
      <input class="form-input" id="f-url" placeholder="https://" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">&Aacute;rea</label>
        <select class="form-select" id="f-area">
          <option value="at">Assist&ecirc;ncia T&eacute;cnica</option>
          <option value="np">Engenharia de Produtos</option>
          <option value="pe">Projetos Especiais</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select class="form-select" id="f-type">
          <option value="Dashboard">Dashboard</option>
          <option value="Report">Report</option>
          <option value="Planilha">Planilha</option>
          <option value="Outro">Outro</option>
        </select>
      </div>
    </div>
    <div class="json-hint">&#128161; Para tornar permanente, adicione tamb&eacute;m no <code>projetos.json</code> no GitHub.</div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">Cancelar</button>
      <button class="btn-save" id="btn-save">Salvar</button>
    </div>
  </div>
</div>

<script>
(function() {
  var PASS = 'Neo@123456';
  var AUTH_KEY = 'ns_hub_auth';
  var projectsCache = [];
  var pendingArea = 'at';

  var AREAS = {
    at: 'Assist\u00eancia T\u00e9cnica',
    np: 'Engenharia de Produtos',
    pe: 'Projetos Especiais'
  };

  var ICONS = {
    Dashboard: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    Report:    '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>',
    Planilha:  '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>',
    Outro:     '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'
  };

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function pad(n) { return String(n).padStart(2,'0'); }

  function startClock() {
    function tick() {
      var d = new Date();
      var el = document.getElementById('clock');
      if (el) el.textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    }
    tick();
    setInterval(tick, 1000);
  }

  function showApp() {
    var ls = document.getElementById('login-screen');
    var app = document.getElementById('app');
    ls.style.cssText = 'display:none !important';
    app.style.cssText = 'display:block !important; min-height:100vh';
    startClock();
    loadAndRender();
  }

  function doLogin() {
    var val = document.getElementById('pwd-input').value;
    var err = document.getElementById('login-error');
    if (val === PASS) {
      sessionStorage.setItem(AUTH_KEY, '1');
      err.style.display = 'none';
      showApp();
    } else {
      err.style.display = 'block';
      document.getElementById('pwd-input').value = '';
      document.getElementById('pwd-input').focus();
    }
  }

  function loadAndRender() {
    fetch('projetos.json?v=' + Date.now())
      .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(data) { projectsCache = data; renderHub(); })
      .catch(function(e) { console.warn('projetos.json:', e); projectsCache = []; renderHub(); });
  }

  function renderHub() {
    var main = document.getElementById('main-content');
    var html = '';
    Object.keys(AREAS).forEach(function(areaKey) {
      var aProjects = projectsCache.filter(function(p) { return p.area === areaKey; });
      var count = aProjects.length;
      html += '<div class="section ' + areaKey + '">';
      html += '<div class="sec-hdr"><span class="pip"></span><span class="sec-label">' + AREAS[areaKey] + '</span>';
      html += '<span class="sec-count">' + (count > 0 ? count + ' projeto' + (count>1?'s':'') : 'em breve') + '</span></div>';
      html += '<div class="cards">';
      aProjects.forEach(function(p) {
        var ico = ICONS[p.type] || ICONS['Outro'];
        html += '<a class="card" href="' + esc(p.url) + '" target="_blank" rel="noopener">';
        html += '<div class="ct"><div class="cico">' + ico + '</div><span class="arr">&#8599;</span></div>';
        html += '<p class="cn">' + esc(p.name) + '</p>';
        html += '<p class="cd">' + esc(p.desc) + '</p>';
        html += '<span class="tag">' + esc(p.type) + '</span></a>';
      });
      html += '<button class="add-card" data-area="' + areaKey + '">';
      html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
      html += 'Adicionar projeto</button>';
      html += '</div></div>';
    });
    html += '<div class="footer"><span>NeoSolar Energia <span class="fy">&middot;</span> Engenharia</span>';
    html += '<span>' + new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}) + '</span></div>';
    main.innerHTML = html;

    // Bind add-card buttons
    main.querySelectorAll('.add-card').forEach(function(btn) {
      btn.addEventListener('click', function() { openModal(btn.dataset.area); });
    });
  }

  function openModal(areaKey) {
    pendingArea = areaKey || 'at';
    document.getElementById('f-name').value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-url').value = '';
    document.getElementById('f-area').value = pendingArea;
    document.getElementById('f-type').value = 'Dashboard';
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(function(){ document.getElementById('f-name').focus(); }, 100);
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  function saveProject() {
    var name = document.getElementById('f-name').value.trim();
    var desc = document.getElementById('f-desc').value.trim();
    var url  = document.getElementById('f-url').value.trim();
    var area = document.getElementById('f-area').value;
    var type = document.getElementById('f-type').value;
    if (!name || !url) { alert('Preencha pelo menos o nome e o link.'); return; }
    var entry = {id:'p'+Date.now(), area:area, name:name, desc:desc, url:url, type:type};
    projectsCache.push(entry);
    closeModal();
    renderHub();
    alert('Projeto adicionado nesta sess\u00e3o!\n\nPara tornar permanente, adicione no projetos.json no GitHub:\n\n' + JSON.stringify(entry, null, 2));
  }

  // Boot
  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('pwd-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
  document.getElementById('btn-sair').addEventListener('click', function() { sessionStorage.removeItem(AUTH_KEY); location.reload(); });
  document.getElementById('btn-novo').addEventListener('click', function() { openModal('at'); });
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  document.getElementById('btn-save').addEventListener('click', saveProject);
  document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

  if (sessionStorage.getItem(AUTH_KEY) === '1') {
    showApp();
  }
})();
</script>
